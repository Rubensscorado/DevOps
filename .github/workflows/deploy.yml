name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-python-api

jobs:
  tests:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar analise estatica
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: pytest --cov=app --cov-report=term-missing

  deploy:
    name: Build, publicacao no ECR e deploy na EC2
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e publicar a imagem no ECR
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Preparar a conexao SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Executar o script de deploy na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s -- '${IMAGE_URI}' '${GITHUB_SHA}'" < scripts/deploy.sh

      - name: Testar a API pelo IP publico
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in $(seq 1 20); do
            if body=$(curl --fail --silent --max-time 5 "http://${EC2_HOST}/version"); then
              echo "$body"
              if echo "$body" | grep --quiet "$GITHUB_SHA"; then
                echo "Versao publicada confere com o commit ${GITHUB_SHA}"
                curl --fail --silent "http://${EC2_HOST}/health"
                exit 0
              fi
            fi
            echo "Tentativa ${attempt}: API publica ainda nao responde com o commit esperado"
            sleep 3
          done
          exit 1

      - name: Remover a chave SSH do runner
        if: always()
        run: rm -f ~/.ssh/ec2_key